<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小三單字挑戰</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; text-align: center; background-color: #f0f8ff; padding-top: 50px; }
        .game-box { background: white; width: 80%; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #chinese-word { font-size: 48px; color: #333; margin-bottom: 20px; font-weight: bold; }
        #english-input { font-size: 32px; padding: 10px; width: 80%; text-align: center; border: 2px solid #ccc; border-radius: 8px; }
        #message { font-size: 24px; margin-top: 20px; font-weight: bold; height: 30px; }
        button { font-size: 24px; padding: 10px 20px; margin-top: 20px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="game-box">
    <h2>🌟 單字小達人 🌟</h2>
    <div id="chinese-word">載入中...</div>
    <input type="text" id="english-input" placeholder="請輸入英文" autocomplete="off">
    <br>
    <button onclick="checkAnswer()">送出答案</button>
    <div id="message"></div>
</div>

<script>
    // 這裡已經換成您專屬的 Google 試算表網址了！
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxgq4tdBKkH9XxYsXSZ0cDlFXXnmkON0lAB1jBP4B7sFwFAj_P6a5ezarU2uCOVVXV2BYexB_7-puV/pub?output=csv';
    
    let wordList = []; 
    let currentQuestionIndex = 0; 
    let isProcessing = false; // 【修改 1】新增防連點變數

    async function fetchWords() {
        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            
            const rows = csvText.split('\n'); 
            
            for (let i = 0; i < rows.length; i++) {
                const columns = rows[i].split(','); 
                if (columns.length >= 2 && columns[0].trim() !== '') {
                    wordList.push({
                        zh: columns[0].trim(), 
                        en: columns[1].trim()  
                    });
                }
            }

            // 【修改 2】將抓下來的單字隨機洗牌
            wordList.sort(() => Math.random() - 0.5);

            if(wordList.length > 0) {
                showQuestion();
            } else {
                document.getElementById('chinese-word').innerText = "找不到單字！請確認表格A欄和B欄有打字。";
            }

        } catch (error) {
            document.getElementById('chinese-word').innerText = "連線失敗，請嘗試使用 Chrome 瀏覽器開啟。";
            console.error("連線錯誤：", error);
        }
    }

    function showQuestion() {
        document.getElementById('chinese-word').innerText = wordList[currentQuestionIndex].zh;
        document.getElementById('english-input').value = ""; 
        document.getElementById('message').innerText = ""; 
        document.getElementById('english-input').focus(); 
        
        isProcessing = false; // 【修改 3】換題完成，解開防連點鎖定
    }

    function checkAnswer() {
        if (isProcessing) return; // 【修改 4】如果系統正在處理中，直接攔截不動作
        isProcessing = true;      // 【修改 5】開始比對答案，將系統上鎖

        const userInput = document.getElementById('english-input').value.toLowerCase().trim();
        const correctAnswer = wordList[currentQuestionIndex].en.toLowerCase().trim();
        const messageDiv = document.getElementById('message');

        if (userInput === correctAnswer) {
            messageDiv.style.color = "green";
            messageDiv.innerText = "⭕ 答對了！太棒了！";
            
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < wordList.length) {
                    showQuestion();
                } else {
                    document.getElementById('chinese-word').innerText = "🎉 恭喜全部過關！";
                    document.getElementById('english-input').style.display = "none";
                    document.querySelector('button').style.display = "none";
                }
            }, 1000);

        } else {
            messageDiv.style.color = "red";
            messageDiv.innerText = "❌ 答錯了，再試一次！";
            document.getElementById('english-input').value = ""; 
            isProcessing = false; // 【修改 6】答錯時也要解開鎖定，讓學生可以重新送出
        }
    }

    document.getElementById('english-input').addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });

    fetchWords();
</script>

</body>
</html>
