<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小三單字挑戰 - 豪華升級版</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; text-align: center; background-color: #f7f9fc; padding-top: 40px; margin: 0; overflow-x: hidden; }
        .game-box { background: white; width: 85%; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); position: relative; }
        .badge { background-color: #ff9800; color: white; padding: 5px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        #chinese-word { font-size: 52px; color: #2c3e50; margin: 20px 0; font-weight: bold; }
        #english-input { font-size: 32px; padding: 12px; width: 80%; text-align: center; border: 3px solid #dee2e6; border-radius: 12px; outline: none; transition: all 0.3s; }
        #english-input:focus { border-color: #4cd137; box-shadow: 0 0 10px rgba(76, 209, 55, 0.2); }
        #message { font-size: 26px; margin-top: 20px; font-weight: bold; height: 35px; }
        button { font-size: 24px; padding: 12px 28px; margin-top: 20px; cursor: pointer; background-color: #4cd137; color: white; border: none; border-radius: 12px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.98); }
        
        /* 連擊與分數顯示 */
        .status-container { display: flex; justify-content: space-around; margin-top: 15px; font-size: 18px; color: #7f8c8d; font-weight: bold; }
        .combo-text { color: #e84118; font-size: 22px; animation: pulse 0.5s infinite alternate; display: none; }
        
        /* 視覺特效：噴發碎紙 */
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; animation: poop 1s ease-out forwards; pointer-events: none; }
        
        /* 獎勵小遊戲畫面（預設隱藏） */
        #bonus-game { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.95); z-index: 999; cubic-bezier: 0.25, 0.46, 0.45, 0.94; }
        .balloon { position: absolute; width: 60px; height: 75px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; cursor: pointer; animation: floatUp 4s linear forwards; }
        .balloon::after { content: ""; position: absolute; bottom: -8px; left: 26px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 8px solid currentColor; }
        #timer-banner { font-size: 36px; color: #e84118; font-weight: bold; margin-top: 20px; }

        @keyframes poop {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
        }
        @keyframes floatUp {
            0% { bottom: -100px; }
            100% { bottom: 105vh; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

<div class="game-box" id="main-box">
    <div class="badge">🌟 單字小達人 🌟</div>
    <div id="chinese-word">載入中...</div>
    <input type="text" id="english-input" placeholder="請輸入英文" autocomplete="off">
    <br>
    <button onclick="checkAnswer()">送出答案</button>
    <div id="message"></div>
    
    <div class="status-container">
        <div id="score-board">得分：0</div>
        <div id="combo-board" class="combo-text">🔥 連擊：0 !!</div>
    </div>
</div>

<div id="bonus-game">
    <div id="timer-banner">🎈 獎勵關卡！氣球消消樂：<span id="countdown">15</span> 秒</div>
    <div style="font-size: 24px; color: #333;">快用滑鼠點破氣球！目前打破：<span id="pop-count" style="font-weight:bold; color:#4cd137;">0</span> 個</div>
</div>

<script>
    // 您的專屬 Google 試算表網址
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxgq4tdBKkH9XxYsXSZ0cDlFXXnmkON0lAB1jBP4B7sFwFAj_P6a5ezarU2uCOVVXV2BYexB_7-puV/pub?output=csv';
    
    let wordList = []; 
    let currentQuestionIndex = 0; 
    let score = 0;
    let combo = 0;
    let balloonInterval;
    let gameTimer;
    let poppedBalloons = 0;

    // 1. 內建音效產生器（免外連檔案）
    function playSound(type) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'correct') {
            // 叮～咚～（雙音調）
            let osc1 = ctx.createOscillator();
            let gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, ctx.currentTime); // C5 (叮)
            gain1.gain.setValueAtTime(0.3, ctx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc1.connect(gain1); gain1.connect(ctx.destination);
            osc1.start(); osc1.stop(ctx.currentTime + 0.2);

            setTimeout(() => {
                let osc2 = ctx.createOscillator();
                let gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, ctx.currentTime); // E5 (咚)
                gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                osc2.start(); osc2.stop(ctx.currentTime + 0.3);
            }, 120);
        } else if (type === 'pop') {
            // 啵！氣球破掉的聲音
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.08);
        }
    }

    // 2. 噴發彩帶視覺特效
    function createConfetti() {
        const box = document.getElementById('main-box');
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#34495e'];
        for (let i = 0; i < 35; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            el.style.left = '50%';
            el.style.top = '40%';
            // 隨機發散方向與距離
            const x = (Math.random() - 0.5) * 400 + 'px';
            const y = (Math.random() - 0.5) * 300 - 100 + 'px';
            el.style.setProperty('--x', x);
            el.style.setProperty('--y', y);
            el.style.setProperty('--r', Math.random() * 360 + 'deg');
            box.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }
    }

    // 3. 陣列隨機洗牌演算法 (隨機出題關鍵)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 抓取雲端資料
    async function fetchWords() {
        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            const rows = csvText.split('\n'); 
            
            wordList = [];
            for (let i = 0; i < rows.length; i++) {
                const columns = rows[i].split(','); 
                if (columns.length >= 2 && columns[0].trim() !== '') {
                    wordList.push({
                        zh: columns[0].trim(), 
                        en: columns[1].trim()  
                    });
                }
            }

            if(wordList.length > 0) {
                shuffle(wordList); // ❗ 在這裡直接將題目順序打亂
                showQuestion();
            } else {
                document.getElementById('chinese-word').innerText = "找不到單字！";
            }
        } catch (error) {
            document.getElementById('chinese-word').innerText = "連線失敗";
        }
    }

    function showQuestion() {
        document.getElementById('chinese-word').innerText = wordList[currentQuestionIndex].zh;
        document.getElementById('english-input').value = ""; 
        document.getElementById('message').innerText = ""; 
        document.getElementById('english-input').focus(); 
    }

    // 檢查答案
    function checkAnswer() {
        const userInput = document.getElementById('english-input').value.toLowerCase().trim();
        const correctAnswer = wordList[currentQuestionIndex].en.toLowerCase().trim();
        const messageDiv = document.getElementById('message');

        if (userInput === correctAnswer) {
            // 答對了！
            playSound('correct'); // 播放叮咚聲
            createConfetti();    // 噴發彩帶
            
            score += 10;
            combo += 1;
            document.getElementById('score-board').innerText = "得分：" + score;
            
            // 處理連擊顯示
            const comboBoard = document.getElementById('combo-board');
            comboBoard.innerText = "🔥 連擊：" + combo + " !!";
            comboBoard.style.display = "block";

            messageDiv.style.color = "#4cd137";
            messageDiv.innerText = "⭕ 太棒了！答對囉！";
            
            setTimeout(() => {
                // ❗ 核心機制：滿 10 連擊觸發小遊戲
                if (combo > 0 && combo % 10 === 0) {
                    startBonusGame();
                    return; 
                }

                nextQuestion();
            }, 1000);

        } else {
            // 答錯了
            combo = 0; // 連擊中斷
            document.getElementById('combo-board').style.display = "none";
            messageDiv.style.color = "#e84118";
            // 溫和提示：顯示第一個字母當線索
            const hint = correctAnswer.charAt(0).toUpperCase();
            messageDiv.innerText = "❌ 再試一次！提示：開頭是 " + hint;
            document.getElementById('english-input').value = ""; 
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < wordList.length) {
            showQuestion();
        } else {
            // 全部單字都答過一遍了，再次洗牌重新輪迴，達成無盡練習
            document.getElementById('message').innerText = "🎉 哇！所有單字都練過一輪了！換個順序繼續挑戰！";
            shuffle(wordList);
            currentQuestionIndex = 0;
            setTimeout(showQuestion, 2000);
        }
    }

    // ======= 🎈 獎勵小遊戲功能區 =======
    function startBonusGame() {
        document.getElementById('bonus-game').style.display = 'block';
        poppedBalloons = 0;
        document.getElementById('pop-count').innerText = "0";
        let timeLeft = 15;
        document.getElementById('countdown').innerText = timeLeft;

        // 每 400 毫秒飛出一顆新氣球
        balloonInterval = setInterval(createBalloon, 400);

        // 倒數計時器
        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                endBonusGame();
            }
        }, 1000);
    }

    function createBalloon() {
        const gameContainer = document.getElementById('bonus-game');
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        
        // 隨機顏色與位置
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#34495e', '#ff6b81'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.color = randomColor;
        balloon.style.backgroundColor = randomColor;
        balloon.style.left = Math.random() * (window.innerWidth - 80) + 'px';
        
        // 點擊氣球事件
        balloon.addEventListener('mousedown', () => {
            playSound('pop');
            poppedBalloons++;
            document.getElementById('pop-count').innerText = poppedBalloons;
            balloon.remove();
        });

        gameContainer.appendChild(balloon);
        
        // 飛出螢幕後自動銷毀
        setTimeout(() => { if(balloon) balloon.remove(); }, 4000);
    }

    function endBonusGame() {
        clearInterval(balloonInterval);
        clearInterval(gameTimer);
        
        // 清除所有畫面上殘留的氣球
        const balloons = document.querySelectorAll('.balloon');
        balloons.forEach(b => b.remove());

        alert("⏰ 時間到！你一共點破了 " + poppedBalloons + " 個氣球！超厲害！\n點擊「確定」繼續背單字挑戰吧！");
        
        document.getElementById('bonus-game').style.display = 'none';
        // 繼續單字遊戲
        nextQuestion();
    }

    // 監聽 Enter 鍵
    document.getElementById('english-input').addEventListener("keypress", function(event) {
        if (event.key === "Enter") { checkAnswer(); }
    });

    fetchWords();
</script>

</body>
</html>
